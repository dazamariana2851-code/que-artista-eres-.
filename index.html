<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121518" />
  <title>Reflejo Creativo — Archetype // El Trazo Interno</title>
  <meta name="description" content="¿Qué artista eres según tu personalidad? Un viaje introspectivo a través de 10 decisiones visuales, cromáticas y emocionales." />

  <!-- Google Fonts: Cormorant Garamond (600,700,700i), Syne (700,800) e Inter (300,400,500,600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Sistema de Diseño y Estilos Mobile-First -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Filtro SVG Orgánico para la Transición de Brochazos de Pincel (feTurbulence + feDisplacementMap) -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="brush-displacement-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03 0.14" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Superposición de Transición de 3 Brochazos de Pincel (950ms Pantalla Completa) -->
  <div id="brush-transition-overlay" class="brush-overlay" aria-hidden="true">
    <div class="brush-band brush-band-1"></div>
    <div class="brush-band brush-band-2"></div>
    <div class="brush-band brush-band-3"></div>
  </div>

  <!-- Contenedor Principal de la Aplicación (5 Vistas) -->
  <div id="app-root"></div>

  <!-- Módulos de la Aplicación (Compatibles con file:// y Servidores Web) -->
  <script src="js/imageData.js"></script>
  <script src="js/data.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
